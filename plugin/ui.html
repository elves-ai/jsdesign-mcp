<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "PingFang SC", sans-serif;
      margin: 0;
      padding: 0;
      color: #222;
      background: #f7f7f8;
      overflow: hidden;
    }

    /* ── collapsed bar ── */
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 10px;
      background: #fff;
      border-bottom: 1px solid #eaeaea;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c4c4c4;
      flex-shrink: 0;
    }
    .dot.on { background: #22a06b; }
    .dot.off { background: #c4c4c4; }
    .status-text {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .bar-actions button {
      padding: 5px 10px;
      border: 0;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #connect { background: #2f6bff; color: #fff; }
    #disconnect {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    #toggle {
      width: 28px;
      height: 28px;
      padding: 0;
      background: #f0f0f2;
      color: #555;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #toggle:hover { background: #e6e6ea; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── expanded panel ── */
    .panel {
      display: none;
      padding: 10px 12px 12px;
    }
    body.expanded .panel { display: block; }
    body.expanded .bar { border-bottom-color: #e6e6e6; }

    .sub {
      font-size: 11px;
      color: #888;
      margin: 0 0 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .actions button {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #refresh, #copy {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    .meta {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .json-wrap {
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    pre {
      margin: 0;
      padding: 10px;
      max-height: 320px;
      overflow: auto;
      font-size: 11px;
      line-height: 1.45;
      color: #d4d4d4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty { color: #999; }
    .toast {
      margin-top: 6px;
      font-size: 11px;
      color: #2f6bff;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span id="dot" class="dot off"></span>
    <span id="statusText" class="status-text">未连接</span>
    <div class="bar-actions">
      <button id="connect">连接</button>
      <button id="disconnect" disabled>断开</button>
      <button id="toggle" title="展开/折叠" aria-label="展开/折叠">▾</button>
    </div>
  </div>

  <div class="panel">
    <p class="sub">连接本地 bridge；选中图层显示 JSON</p>

    <div class="actions">
      <button id="refresh">刷新选中</button>
      <button id="copy" disabled>复制 JSON</button>
    </div>

    <div id="meta" class="meta">未选中元素</div>
    <div class="json-wrap">
      <pre id="jsonView" class="empty">在画布点击元素后显示 JSON…</pre>
    </div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    var BASE = 'http://127.0.0.1:3847';
    var sessionId = null;
    var polling = false;
    var latestJson = '';
    var expanded = false;

    var dot = document.getElementById('dot');
    var statusText = document.getElementById('statusText');
    var connectBtn = document.getElementById('connect');
    var disconnectBtn = document.getElementById('disconnect');
    var toggleBtn = document.getElementById('toggle');
    var copyBtn = document.getElementById('copy');
    var refreshBtn = document.getElementById('refresh');
    var jsonView = document.getElementById('jsonView');
    var metaEl = document.getElementById('meta');
    var toastEl = document.getElementById('toast');

    function setExpanded(next) {
      expanded = !!next;
      document.body.className = expanded ? 'expanded' : '';
      toggleBtn.textContent = expanded ? '▴' : '▾';
      toggleBtn.title = expanded ? '折叠' : '展开';
      parent.postMessage(
        { pluginMessage: { type: 'resize-ui', expanded: expanded } },
        '*'
      );
    }

    function setStatus(on, text) {
      dot.className = 'dot ' + (on ? 'on' : 'off');
      statusText.textContent = text;
      statusText.title = text;
      connectBtn.disabled = on;
      disconnectBtn.disabled = !on;
    }

    function showToast(text) {
      toastEl.textContent = text || '';
      if (text) {
        setTimeout(function () {
          if (toastEl.textContent === text) toastEl.textContent = '';
        }, 2500);
      }
    }

    function renderPreview(msg) {
      if (!msg.ok) {
        latestJson = '';
        copyBtn.disabled = true;
        metaEl.textContent = msg.message || '未选中元素';
        jsonView.className = 'empty';
        jsonView.textContent = msg.message || '在画布点击元素后显示 JSON…';
        return;
      }
      latestJson = JSON.stringify(msg.payload, null, 2);
      copyBtn.disabled = false;
      metaEl.textContent =
        (msg.nodeType || '') +
        ' · ' +
        (msg.nodeName || '') +
        ' · id=' +
        (msg.nodeId || '');
      jsonView.className = '';
      jsonView.textContent = latestJson;
    }

    function pollLoop() {
      if (!polling || !sessionId) return;
      fetch(BASE + '/plugin/wait?sessionId=' + encodeURIComponent(sessionId))
        .then(function (res) {
          if (res.status === 401) {
            throw new Error('会话失效，请重新连接');
          }
          return res.json();
        })
        .then(function (body) {
          if (!polling) return;
          if (body && body.job) {
            parent.postMessage(
              {
                pluginMessage: {
                  type: 'fetch-node',
                  requestId: body.job.requestId,
                  nodeId: body.job.nodeId,
                  meta: body.job.meta || {},
                },
              },
              '*'
            );
          }
          pollLoop();
        })
        .catch(function (err) {
          if (!polling) return;
          setStatus(false, '连接中断：' + (err && err.message ? err.message : err));
          polling = false;
          sessionId = null;
        });
    }

    function connect() {
      setStatus(false, '连接中…');
      fetch(BASE + '/health')
        .then(function (res) {
          if (!res.ok) throw new Error('health HTTP ' + res.status);
          return res.json();
        })
        .then(function () {
          return fetch(BASE + '/plugin/connect', { method: 'POST' });
        })
        .then(function (res) {
          return res.json();
        })
        .then(function (body) {
          if (!body || !body.ok || !body.sessionId) {
            throw new Error((body && body.error) || 'connect failed');
          }
          sessionId = body.sessionId;
          polling = true;
          setStatus(true, '已连接');
          pollLoop();
        })
        .catch(function (err) {
          setStatus(false, '连接失败：本机 3847 无服务');
          showToast(String(err && err.message ? err.message : err));
          if (!expanded) setExpanded(true);
        });
    }

    function disconnect() {
      polling = false;
      var sid = sessionId;
      sessionId = null;
      if (sid) {
        fetch(BASE + '/plugin/disconnect', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sessionId: sid }),
        }).catch(function () {});
      }
      setStatus(false, '未连接');
    }

    toggleBtn.onclick = function () {
      setExpanded(!expanded);
    };
    connectBtn.onclick = connect;
    disconnectBtn.onclick = disconnect;
    refreshBtn.onclick = function () {
      parent.postMessage({ pluginMessage: { type: 'refresh-selection' } }, '*');
    };
    copyBtn.onclick = function () {
      if (!latestJson) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(latestJson).then(
          function () { showToast('已复制 JSON'); },
          function () { fallbackCopy(); }
        );
      } else {
        fallbackCopy();
      }
    };

    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = latestJson;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('已复制 JSON');
      } catch (e) {
        showToast('复制失败');
      }
      document.body.removeChild(ta);
    }

    onmessage = function (event) {
      var msg = event.data && event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'selection-preview') {
        renderPreview(msg);
        return;
      }

      if (msg.type === 'fetch-node-result') {
        fetch(BASE + '/plugin/result', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(msg),
        }).catch(function () {});
      }
    };

    // Probe on open — toast only visible when expanded
    fetch(BASE + '/health')
      .then(function (r) { return r.json(); })
      .then(function (b) {
        showToast(b.ok ? '检测到 bridge，可点击连接' : 'bridge 异常');
      })
      .catch(function () {
        showToast('未检测到 bridge（需 npm run bridge 或 Cursor MCP）');
      });
  </script>
</body>
</html>
