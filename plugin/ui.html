<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: "PingFang SC", sans-serif;
      padding: 16px;
      color: #222;
      background: #f7f7f8;
      margin: 0;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #888; margin-bottom: 14px; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c4c4c4;
      flex-shrink: 0;
    }
    .dot.on { background: #22a06b; }
    .dot.off { background: #c4c4c4; }
    .actions { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    #connect { background: #2f6bff; color: #fff; }
    #disconnect { background: #fff; color: #333; border: 1px solid #ddd; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint { margin-top: 12px; font-size: 11px; color: #999; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>JsDesign → Cursor</h1>
  <p class="sub">连接本地 MCP 后，把设计链接发给 AI 即可</p>

  <div class="status-row">
    <span id="dot" class="dot off"></span>
    <span id="statusText">未连接</span>
  </div>

  <div class="actions">
    <button id="connect">连接</button>
    <button id="disconnect" disabled>断开连接</button>
  </div>

  <p class="hint">
    默认 ws://127.0.0.1:3847/plugin<br />
    复制含 linkelement 的链接给 Cursor，例如：<br />
    …&amp;linkelement=82-2142
  </p>

  <script>
    var WS_URL = 'ws://127.0.0.1:3847/plugin';
    var ws = null;
    var connected = false;

    var dot = document.getElementById('dot');
    var statusText = document.getElementById('statusText');
    var connectBtn = document.getElementById('connect');
    var disconnectBtn = document.getElementById('disconnect');

    function setStatus(on, text) {
      connected = on;
      dot.className = 'dot ' + (on ? 'on' : 'off');
      statusText.textContent = text;
      connectBtn.disabled = on;
      disconnectBtn.disabled = !on;
    }

    function connect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      setStatus(false, '连接中…');
      try {
        ws = new WebSocket(WS_URL);
      } catch (e) {
        setStatus(false, '无法创建连接');
        return;
      }

      ws.onopen = function () {
        ws.send(JSON.stringify({ type: 'hello', role: 'plugin' }));
        setStatus(true, '已连接');
      };

      ws.onclose = function () {
        ws = null;
        setStatus(false, '未连接');
      };

      ws.onerror = function () {
        setStatus(false, '连接失败（请确认 Cursor MCP 已启动）');
      };

      ws.onmessage = function (event) {
        var msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          return;
        }
        if (msg.type === 'fetch-node') {
          parent.postMessage(
            {
              pluginMessage: {
                type: 'fetch-node',
                requestId: msg.requestId,
                nodeId: msg.nodeId,
                meta: msg.meta || {},
              },
            },
            '*'
          );
        }
      };
    }

    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
      }
      setStatus(false, '未连接');
    }

    connectBtn.onclick = connect;
    disconnectBtn.onclick = disconnect;

    onmessage = function (event) {
      var msg = event.data && event.data.pluginMessage;
      if (!msg || msg.type !== 'fetch-node-result') return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(msg));
    };
  </script>
</body>
</html>
